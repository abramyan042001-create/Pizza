{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Pizza House{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'pizza_hanz/style.css' %}"></head><body>
<header class="header"><a class="logo" href="{% url 'menu' %}"><span>🍕</span> Pizza House</a><nav><a href="{% url 'menu' %}">Меню</a><a class="cart-link" href="{% url 'cart' %}">Корзина <b>{{ cart_count|default:0 }}</b></a></nav></header>
{% if messages %}<div class="messages">{% for message in messages %}<div>{{ message }}</div>{% endfor %}</div>{% endif %}<main>{% block content %}{% endblock %}</main><footer>© {% now "Y" %} Pizza House · Готовим с любовью</footer></body></html>
